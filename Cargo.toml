[workspace]
resolver = "2"
members = [
    "crates/ytm-core",
    "crates/ytm-store",
    "crates/ytm-ops",
    "crates/ytm-enrich",
    "crates/ytm-cli",
    "crates/ytm-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/waldseelen/YTMUSICFY"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
crossterm = "0.28"
csv = "1.3"
directories = "5"
eframe = "0.31"
egui_extras = "0.31"
hex = "0.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
indicatif = "0.17"
rand = "0.8"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "brotli", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
souvlaki = "0.9"
strsim = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
ytm-core = { path = "crates/ytm-core" }
ytm-store = { path = "crates/ytm-store" }
ytm-ops = { path = "crates/ytm-ops" }
ytm-enrich = { path = "crates/ytm-enrich" }
